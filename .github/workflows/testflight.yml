name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Cloud signing (no personal Mac), manual certificate, or unsigned Mac build check'
        type: choice
        options:
          - cloud
          - manual
          - unsigned
        default: cloud
        required: true
      build_number:
        description: 'Optional unique Apple build number (default: run number × 100 + attempt)'
        type: string
        required: false
      upload:
        description: 'Upload the signed IPA to App Store Connect / TestFlight'
        type: boolean
        default: false
        required: true
      keep_ipa:
        description: 'Keep a downloadable IPA artifact (public repository: broadly accessible)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    environment: testflight
    timeout-minutes: 90
    env:
      GODOT_VERSION: 4.7.2
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_VERSION: ${{ vars.IOS_VERSION }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
      DO_UPLOAD: ${{ inputs.upload }}
      KEEP_IPA: ${{ inputs.keep_ipa }}
      SIGNING_MODE: ${{ inputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate settings and configure temporary export preset
        shell: bash
        run: |
          set -euo pipefail
          build_number="${INPUT_BUILD_NUMBER:-$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))}"
          export IOS_BUILD_NUMBER="$build_number"
          if [ "$SIGNING_MODE" = unsigned ]; then
            if [ "$DO_UPLOAD" = true ] || [ "$KEEP_IPA" = true ]; then
              echo 'Unsigned mode cannot upload or produce an IPA artifact.' >&2; exit 1
            fi
            export APPLE_TEAM_ID="${APPLE_TEAM_ID:-ABCDE12345}"
            export IOS_BUNDLE_ID="${IOS_BUNDLE_ID:-com.example.scopatest}"
          fi
          python3 tools/ci/configure_ios.py
          echo "IOS_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_ID=$IOS_BUNDLE_ID" >> "$GITHUB_ENV"
      - name: Check required signing and upload secrets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_MODE" = manual ]; then
            for name in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
              if [ -z "${!name}" ]; then echo "Missing manual-signing secret: $name; see docs/TESTFLIGHT.md" >&2; exit 1; fi
            done
          fi
          if [ "$SIGNING_MODE" = cloud ] || [ "$DO_UPLOAD" = true ]; then
            for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
              if [ -z "${!name}" ]; then echo "Missing App Store Connect secret: $name; see docs/TESTFLIGHT.md" >&2; exit 1; fi
            done
          fi
      - name: Download and verify Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo 'c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  '"$RUNNER_TEMP/godot.zip" | shasum -a 256 -c
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  '"$RUNNER_TEMP/templates.tpz" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable" "$RUNNER_TEMP/tpl"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/ios.zip' 'templates/version.txt' -d "$RUNNER_TEMP/tpl"
          cp "$RUNNER_TEMP/tpl/templates/ios.zip" "$RUNNER_TEMP/tpl/templates/version.txt" "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT=$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Import and export the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT" --headless --editor --path "$GITHUB_WORKSPACE" --import
          "$GODOT" --headless --path "$GITHUB_WORKSPACE" --export-release iOS build/ios/ScopaFourRealms.ipa
          test -d build/ios/ScopaFourRealms.xcodeproj
      - name: Install signing certificate and validate provisioning profile
        if: inputs.signing == 'manual'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "Missing signing secret: $name; see docs/TESTFLIGHT.md" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 tools/ci/check_profile.py "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/scopa-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/scopa-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/scopa-signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/scopa-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/scopa-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/scopa-signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$RUNNER_TEMP/scopa-signing.keychain-db" | grep -q 'Apple Distribution' || { echo 'No Apple Distribution signing identity found' >&2; exit 1; }
      - name: Archive with manual signing
        if: inputs.signing == 'manual'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project build/ios/ScopaFourRealms.xcodeproj -scheme ScopaFourRealms \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScopaFourRealms.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ScopaFourRealms.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
      - name: Archive without signing
        if: inputs.signing != 'manual'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project build/ios/ScopaFourRealms.xcodeproj -scheme ScopaFourRealms \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScopaFourRealms.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export with Apple cloud signing
        if: inputs.signing == 'cloud'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || { echo 'Invalid API key ID' >&2; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 -c 'import os,plistlib; plistlib.dump({"method":"app-store-connect","destination":"export","signingStyle":"automatic","teamID":os.environ["APPLE_TEAM_ID"],"manageAppVersionAndBuildNumber":False,"uploadSymbols":True},open(os.environ["RUNNER_TEMP"]+"/CloudExportOptions.plist","wb"))'
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ScopaFourRealms.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/CloudExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Check IPA was produced
        if: inputs.signing != 'unsigned'
        shell: bash
        run: |
          set -euo pipefail
          count=$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')
          [ "$count" = 1 ] || { echo "Expected exactly one IPA, got $count" >&2; exit 1; }
      - name: Upload IPA artifact (accessible to repository readers)
        if: inputs.keep_ipa
        uses: actions/upload-artifact@v4
        with:
          name: Scopa-iOS-${{ env.IOS_BUILD_NUMBER }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to App Store Connect
        if: inputs.upload
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
            if [ -z "${!name}" ]; then echo "Missing App Store Connect secret: $name; see docs/TESTFLIGHT.md" >&2; exit 1; fi
          done
          [[ "$ASC_KEY_ID" =~ ^[A-Za-z0-9]+$ ]] || { echo 'Invalid API key ID' >&2; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          ipa=$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/scopa-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -rf "$RUNNER_TEMP/private_keys"
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
